<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <rect width="320" height="180" fill="#161618"/>
  <rect width="320" height="26" fill="#1c1c1e"/>
  <text x="12" y="17" font-family="sans-serif" font-size="11" fill="#f5f5f7">Agent board</text>

  <rect x="10" y="34" width="184" height="14" rx="3" fill="#2c2c2e"/>
  <rect x="10" y="54" width="88" height="116" rx="5" fill="#1c1c1e" stroke="#3a3a3c"/>
  <rect x="104" y="54" width="90" height="116" rx="5" fill="#1c1c1e" stroke="#3a3a3c"/>

  <!-- Four lanes share the right rail. Bars are rects inside each badge, not strokes. -->
  <g fill="#2c2c2e">
    <rect x="202" y="34" width="108" height="32" rx="4"/>
    <rect x="202" y="70" width="108" height="32" rx="4"/>
    <rect x="202" y="106" width="108" height="32" rx="4"/>
    <rect x="202" y="142" width="108" height="32" rx="4"/>
  </g>
  <g font-family="sans-serif" font-size="7" fill="#8e8e93">
    <text x="208" y="44">Needs you</text>
    <text x="208" y="80">Working</text>
    <text x="208" y="116">Done</text>
    <text x="208" y="152">Idle</text>
  </g>

  <!-- Needs you -->
  <rect x="208" y="48" width="46" height="14" rx="3" fill="#1c1c1e" stroke="#3a3a3c"/>
  <rect x="208" y="48" width="2" height="14" rx="1" fill="#ff9f0a"/>
  <rect x="258" y="48" width="46" height="14" rx="3" fill="#1c1c1e" stroke="#3a3a3c"/>
  <rect x="258" y="48" width="2" height="14" rx="1" fill="#ff9f0a"/>

  <!-- Working. The note chip is only as wide as the note, and stays inside the lane. -->
  <rect x="208" y="82" width="58" height="12" rx="3" fill="#1c1c1e" stroke="#ff9f0a"/>
  <rect x="208" y="82" width="2" height="12" rx="1" fill="#8fb8de"/>
  <rect x="214" y="95" width="18" height="6" rx="2" fill="#ff9f0a" fill-opacity="0.35"/>

  <!-- Done -->
  <rect x="208" y="120" width="40" height="14" rx="3" fill="#1c1c1e" stroke="#3a3a3c"/>
  <rect x="208" y="120" width="2" height="14" rx="1" fill="#ffc27a"/>
  <rect x="252" y="120" width="44" height="14" rx="3" fill="#1c1c1e" stroke="#3a3a3c"/>
  <rect x="252" y="120" width="2" height="14" rx="1" fill="#ffc27a"/>

  <!-- Idle -->
  <rect x="208" y="156" width="48" height="14" rx="3" fill="#1c1c1e" stroke="#3a3a3c"/>
  <rect x="208" y="156" width="2" height="14" rx="1" fill="#8e8e93"/>
  <rect x="260" y="156" width="44" height="14" rx="3" fill="#1c1c1e" stroke="#3a3a3c"/>
  <rect x="260" y="156" width="2" height="14" rx="1" fill="#8e8e93"/>
</svg>
